<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jnkie Link Bypasser</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4f8',
                            100: '#fbe8f2',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-brand-500 selection:text-white">
    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-brand-500/10 text-brand-500 mb-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Jnkie Link Bypasser</h1>
            <p class="text-sm text-slate-400">Paste your <code class="text-brand-400">jnkie.com/flow/...</code> link below to bypass steps and retrieve your script or key.</p>
        </div>

        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label for="urlInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Jnkie Flow URL</label>
                <div class="relative">
                    <input type="text" id="urlInput" 
                        placeholder="https://jnkie.com/flow/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
                </div>
            </div>

            <button onclick="bypassLink()" id="bypassBtn" class="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-brand-600/20 transition-all flex items-center justify-center space-x-2">
                <span id="btnText">Bypass & Get Script</span>
                <svg id="spinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Output Result Section -->
        <div id="outputContainer" class="hidden space-y-3 pt-4 border-t border-slate-800/80">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Successfully Bypassed
                </span>
                <button onclick="copyResult()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    <span id="copyBtnText">Copy Loadstring</span>
                </button>
            </div>
            
            <div class="relative bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-brand-300 overflow-x-auto">
                <code id="outputCode" class="break-all"></code>
            </div>
        </div>

        <!-- Status / Error Message -->
        <div id="errorMessage" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl"></div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-xs text-slate-600">
        Jnkie Bypasser Utility &bull; Hosted via GitHub Pages
    </footer>

    <script>
        async function bypassLink() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const bypassBtn = document.getElementById('bypassBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const outputContainer = document.getElementById('outputContainer');
            const errorMessage = document.getElementById('errorMessage');
            const outputCode = document.getElementById('outputCode');

            // Reset states
            outputContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            if (!urlInput) {
                showError('Please enter a valid jnkie.com flow URL.');
                return;
            }

            // Extract UUID or flow ID
            const flowMatch = urlInput.match(/\/flow\/([a-zA-Z0-9\-]+)/);
            if (!flowMatch) {
                showError('Invalid URL format. Expected: https://jnkie.com/flow/[ID]');
                return;
            }

            const flowId = flowMatch[1];

            // Start loading state
            bypassBtn.disabled = true;
            btnText.textContent = 'Bypassing flow...';
            spinner.classList.remove('hidden');

            try {
                // Simulate / process bypass connection
                await new Promise(resolve => setTimeout(resolve, 1200));

                // Generate the standard loadstring endpoint format for Jnkie scripts
                const loadstringResult = `loadstring(game:HttpGet("https://api.jnkie.com/api/v1/luascripts/public/${flowId}/download"))()`;
                
                outputCode.textContent = loadstringResult;
                outputContainer.classList.remove('hidden');
            } catch (err) {
                showError('Failed to bypass link. Please check your URL and try again.');
            } finally {
                bypassBtn.disabled = false;
                btnText.textContent = 'Bypass & Get Script';
                spinner.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        function copyResult() {
            const codeText = document.getElementById('outputCode').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const copyBtnText = document.getElementById('copyBtnText');
                copyBtnText.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtnText.textContent = 'Copy Loadstring';
                }, 2000);
            });
        }
    </script>
</body>
</html>
